# ---------------------------------------------------------------------------
# Optional local/alternative deployment for the API-only repository.
#
# The documented path is a Dokploy **Application** built from this repo's
# Dockerfile (see README). This compose file is for running the same image
# outside Dokploy: it expects an existing Postgres and does not create one.
#
#   WC_DATABASE_URL=postgresql+asyncpg://USER:PASSWORD@HOST:5432/DB
#   WC_API_TOKEN=<openssl rand -hex 24>
#   WC_GEMINI_API_KEY=...
#   docker compose up -d --build
# ---------------------------------------------------------------------------
services:
  api:
    build: .
    restart: unless-stopped
    # Long uploads and SSE streams need more than Docker's 10 second default.
    stop_grace_period: 2m
    env_file:
      - path: .env
        required: false
    environment:
      # The same host path the worker mounts: it reads what this service writes.
      WC_STORAGE_PATH: /var/lib/workconsole/objects
    volumes:
      - /var/lib/workconsole/objects:/var/lib/workconsole/objects
    ports:
      # Local use only. Put TLS in front (Caddy/Cloudflare/Tailscale) before
      # exposing this beyond the machine; the bearer token is sent in the clear.
      - "127.0.0.1:8080:8080"
